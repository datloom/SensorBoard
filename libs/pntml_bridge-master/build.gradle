plugins {
    id 'org.springframework.boot' version '2.6.3'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
}

group = 'jp.go.aist.dprt'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

configurations.all {
    exclude module: 'slf4j-log4j12'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven() { url "https://ksqldb-maven.s3.amazonaws.com/maven/" }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
//    testImplementation 'org.springframework.kafka:spring-kafka-tests'

    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.5'
    implementation group: 'io.confluent.ksql', name: 'ksqldb-api-client', version: '0.24.0'
}

tasks.named('test') {
//    useJUnitPlatform()
}
